name: QVeris Financial News Signal

on:
  schedule:
    # Daily 09:30 Asia/Shanghai.
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: qveris-financial-news-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch financial news signal
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
        run: python scripts/fetch_financial_news_signal.py

      - name: Generate financial news signal image
        run: python scripts/generate_financial_news_signal_image.py

      - name: Generate financial news signal tweet and archive card
        env:
          WEBSITE_URL: https://qveris.ai
        run: python scripts/generate_financial_news_signal_tweet.py

      - name: Commit archive
        run: |
          git config user.name "qveris-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json data/financial_news_signal.json data/financial_news_signal_tweet_preview.txt
          git add images/financial_news_signal_*.png public/posts/financial_news_signal_*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No financial news signal archive changes to commit."
            exit 0
          fi

          git commit -m "chore: archive financial news signal $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote rebase."
            sleep 3
          done

          echo "Could not push archive after 3 attempts."
          exit 1
