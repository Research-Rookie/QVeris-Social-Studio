name: QVeris News vs Price Reaction

on:
  schedule:
    # Daily 10:30 Asia/Shanghai.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: qveris-news-vs-price-reaction
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch financial news signal
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
        run: python scripts/fetch_financial_news_signal.py

      - name: Build news vs price reaction data
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
        run: python scripts/fetch_news_vs_price_reaction.py

      - name: Generate news vs price reaction image
        run: python scripts/generate_news_vs_price_reaction_image.py

      - name: Generate news vs price reaction tweet and archive card
        env:
          WEBSITE_URL: https://qveris.ai
        run: python scripts/generate_news_vs_price_reaction_tweet.py

      - name: Commit archive
        run: |
          git config user.name "qveris-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json data/financial_news_signal.json data/news_vs_price_reaction.json data/news_vs_price_reaction_tweet_preview.txt
          git add images/news_vs_price_reaction_*.png public/posts/news_vs_price_reaction_*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No news vs price reaction archive changes to commit."
            exit 0
          fi

          git commit -m "chore: archive news vs price reaction $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote rebase."
            sleep 3
          done

          echo "Could not push archive after 3 attempts."
          exit 1
