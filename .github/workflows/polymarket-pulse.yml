name: QVeris Prediction Market Radar

on:
  schedule:
    # Daily 09:15 Asia/Shanghai.
    - cron: "15 1 * * *"
  workflow_dispatch:

concurrency:
  group: qveris-prediction-market-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch prediction market radar
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
        run: python scripts/fetch_polymarket_pulse.py

      - name: Generate prediction market radar image
        run: python scripts/generate_polymarket_pulse_image.py

      - name: Generate prediction market radar tweet and archive card
        env:
          WEBSITE_URL: https://qveris.ai
        run: python scripts/generate_polymarket_pulse_tweet.py

      - name: Commit archive
        run: |
          git config user.name "qveris-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json data/polymarket_pulse.json data/polymarket_pulse_tweet_preview.txt
          git add images/polymarket_pulse_*.png public/posts/polymarket_pulse_*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No prediction market radar archive changes to commit."
            exit 0
          fi

          git commit -m "chore: archive prediction market radar $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote rebase."
            sleep 3
          done

          echo "Could not push archive after 3 attempts."
          exit 1
