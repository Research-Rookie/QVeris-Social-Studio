name: Diagnose QVeris Financial News Capabilities

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run financial news capability diagnostic
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
        run: python scripts/diagnose_financial_news_capabilities.py

      - name: Commit diagnostic output
        run: |
          git config user.name "qveris-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/financial_news_capability_diagnostic.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
            exit 0
          fi
          git commit -m "chore: diagnose financial news qveris capabilities"

          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote rebase."
            sleep 3
          done

          echo "Could not push diagnostic output after 3 attempts."
          exit 1
