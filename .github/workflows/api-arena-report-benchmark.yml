name: QVeris API Arena Report Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run five-prompt Arena and Battle benchmarks
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          QVERIS_MAX_EXPECTED_CREDITS: "30"
          LIVE_API_BATTLE_MAX_CANDIDATES: "10"
        run: python scripts/run_api_arena_report_benchmark.py
      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: qveris-api-arena-report-benchmark
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 14
