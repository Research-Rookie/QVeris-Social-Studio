name: Diagnose QVeris Polymarket Capabilities

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Polymarket capability diagnostic
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
        run: python scripts/diagnose_polymarket_capabilities.py

      - name: Commit diagnostic output
        run: |
          git config user.name "qveris-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/polymarket_capability_diagnostic.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
            exit 0
          fi
          git commit -m "chore: diagnose polymarket qveris capabilities"
          git pull --rebase origin master
          git push origin master
