name: QVeris Financial Data API Watch

on:
  schedule:
    # Daily 10:00 Asia/Shanghai.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: qveris-financial-data-api-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch FCF valuation data
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
          FCF_SYMBOLS: MSFT,GOOGL
        run: python scripts/fetch_fcf_yield.py

      - name: Fetch financial news signal
        env:
          QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}
        run: python scripts/fetch_financial_news_signal.py

      - name: Build financial data API watch dataset
        run: python scripts/build_financial_data_api_watch.py

      - name: Generate financial data API watch image
        run: python scripts/generate_financial_data_api_watch_image.py

      - name: Generate financial data API watch tweet and archive card
        env:
          WEBSITE_URL: https://qveris.ai
        run: python scripts/generate_financial_data_api_watch_tweet.py

      - name: Commit archive
        run: |
          git config user.name "qveris-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json data/financial_data_api_watch.json data/financial_data_api_watch_tweet_preview.txt
          git add images/financial_data_api_watch_*.png public/posts/financial_data_api_watch_*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No financial data API watch archive changes to commit."
            exit 0
          fi
          git commit -m "chore: archive financial data api watch $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote rebase."
            sleep 3
          done
          echo "Could not push archive after 3 attempts."
          exit 1
