<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 675px;
        background:
          radial-gradient(circle at 18% 12%, rgba(58, 190, 255, 0.22), transparent 30%),
          radial-gradient(circle at 88% 18%, rgba(94, 234, 212, 0.14), transparent 27%),
          linear-gradient(135deg, #0b1324 0%, #151827 58%, #211524 100%);
        color: #f8fafc;
        font-family: Inter, Arial, sans-serif;
      }
      .card { width: 1200px; height: 675px; padding: 40px 44px; position: relative; overflow: hidden; }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      }
      header, .content { position: relative; z-index: 2; }
      .date {
        position: absolute; top: 34px; right: 44px;
        border: 1px solid rgba(148, 163, 184, 0.34);
        border-radius: 999px; padding: 10px 18px;
        color: #dbeafe; font-size: 18px; font-weight: 800;
        background: rgba(255,255,255,0.06);
      }
      .brand {
        position: absolute; top: 92px; right: 44px;
        display: flex; align-items: center; gap: 10px;
        color: #fff; font-size: 22px; font-weight: 950;
      }
      .brand img { width: 38px; height: 38px; }
      .eyebrow {
        margin: 0 0 14px; color: #67e8f9;
        font-size: 16px; font-weight: 900;
        letter-spacing: 0.24em; text-transform: uppercase;
      }
      h1 {
        margin: 0; max-width: 860px;
        font-size: 52px; line-height: 0.96;
        letter-spacing: -0.06em;
      }
      .subtitle { margin-top: 12px; color: #b8c6dc; font-size: 22px; font-weight: 800; }
      .content {
        display: grid; grid-template-columns: 0.95fr 1.05fr;
        gap: 22px; margin-top: 26px;
      }
      .panel {
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 28px; padding: 22px;
        min-height: 316px; background: rgba(8, 13, 27, 0.64);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }
      .task {
        border-radius: 22px; padding: 18px;
        background: rgba(255,255,255,0.07);
        margin-bottom: 18px;
      }
      .label {
        color: #9fb2cc; font-size: 14px; font-weight: 900;
        text-transform: uppercase; letter-spacing: 0.06em;
      }
      .task strong {
        display: block; margin-top: 9px;
        color: #fff; font-size: 22px; line-height: 1.12;
        letter-spacing: -0.04em;
      }
      .sideTitle { margin: 0 0 14px; color: #e2e8f0; font-size: 22px; font-weight: 950; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 11px; }
      li {
        display: flex; justify-content: space-between; align-items: center; gap: 14px;
        border-radius: 18px; padding: 13px 14px;
        background: rgba(255,255,255,0.07);
        color: #dbeafe; font-size: 14px; font-weight: 850;
      }
      li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li b { color: #5eead4; flex: 0 0 auto; }
      .capList li span::before {
        content: ""; display: inline-block; width: 8px; height: 8px;
        margin-right: 10px; border-radius: 999px; background: #67e8f9;
        box-shadow: 0 0 18px rgba(103,232,249,0.7);
      }
      .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
      .metric {
        border-radius: 22px; padding: 16px;
        background: rgba(255,255,255,0.07);
      }
      .metric span { display: block; color: #9fb2cc; font-size: 13px; font-weight: 850; }
      .metric strong {
        display: block; margin-top: 8px;
        font-size: 26px; line-height: 1.04; letter-spacing: -0.05em;
      }
      .takeaway {
        margin: 15px 0 0; color: #c7d2fe;
        font-size: 17px; line-height: 1.35; font-weight: 800;
      }
      .newsStrip {
        margin-top: 14px; border-radius: 18px; padding: 14px 16px;
        background: rgba(94, 234, 212, 0.10);
        color: #c7d2fe; font-size: 14px; font-weight: 900;
      }
      .newsStrip b { color: #5eead4; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="grid"></div>
      <div class="date">{{DATE}}</div>
      <span class="brand"><img src="{{LOGO}}" /> QVeris</span>
      <header>
        <p class="eyebrow">Financial Data API Watch</p>
        <h1>What can an AI finance agent retrieve?</h1>
        <div class="subtitle">{{SCENARIO}} powered by QVeris API discovery</div>
      </header>
      <section class="content">
        <div class="panel">
          <div class="task">
            <span class="label">Today's agent task</span>
            <strong>{{AGENT_TASK}}</strong>
          </div>
          <h2 class="sideTitle">QVeris connected</h2>
          <ul class="capList">{{CAPABILITIES}}</ul>
        </div>
        <aside class="panel">
          <h2 class="sideTitle">Research-ready output</h2>
          <div class="metrics">{{METRICS}}</div>
          <ul>{{RETRIEVED}}</ul>
          <div class="newsStrip">News signal: <b>{{NEWS_SIGNAL}}</b></div>
        </aside>
      </section>
    </main>
  </body>
</html>
